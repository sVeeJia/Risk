services:
  risk:
    image: risk-game
    container_name: risk-game
    build:
      context: ..
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - Mongo__ConnectionString=${MONGO_CONNECTION_STRING}
      - Jwt__Key=${JWT_KEY}
      - Mistral__ApiKey=${MISTRAL_API_KEY:-}