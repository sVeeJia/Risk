name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Risk.Tests
      - run: dotnet build Risk.Tests --no-restore
      - run: dotnet test Risk.Tests --no-build

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: risk-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: risk-web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
